<header class="barra">
  <div class="barra_interior">
    <span class="barra_marca">
      <img src="logo.svg" alt="" /> Gimnasio Titanes
      <span class="barra_etiqueta"> Admin </span>
    </span>
  </div>
</header>

<main class="pagina">
  <div class="encabezado">
    <h1>Catalogo de clases</h1>
    <p>Estos datos son del archivo local</p>
  </div>
  <div class="acciones">
    <button class="boton boton--secundario" (click)="vaciar()">Vaciar</button>
    <button class="boton" (click)="restaurar()">Restaurar</button>
  </div>
  <section>
    <div class="resumen_dato">
      <span class="resumen_numero">{{ clases.length }}</span>
      <span class="resumen_texto"> clases en el cátalogo </span>
    </div>
    <div class="resumen_dato">
      <span class="resumen_numero">{{ minutosTotales }}</span>
      <span class="resumen_texto"> minutos a la semana </span>
    </div>
    <div class="resumen_dato">
      <span class="resumen_numero">{{ clasesLargas }}</span>
      <span class="resumen_texto"> clases de una hora o mas </span>
    </div>
  </section>

  <div class="rejillas">
    @for (clase of clases; track clase.id){
      <app-tarjeta-clase [clase]="clase"></app-tarjeta-clase>
    } @empty {
      <p class="vacio"> No hay clases disponibles </p>
    }
      
  </div>
</main>
